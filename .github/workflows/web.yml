name: Web app

on:
  push:
    paths-ignore: ['mobile/**']
  pull_request:
    paths-ignore: ['mobile/**']

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
